<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedDenoise-Agent · 医学影像智能去噪</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    :root {
      --primary: #122e8a;
      --primary-light: #1e40af;
      --bg: #f5efea;
      --panel: #fff;
      --panel2: #faf7f3;
      --text: #111827;
      --muted: #5c6476;
      --line: #e6e0da;
      --success: #0f7a3e;
      --danger: #b91c1c;
      --shadow: 0 4px 12px rgba(18,46,138,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    #app { min-height: 100vh; }
    button, input, select, textarea {
      font: inherit;
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      transition: background .2s;
    }
    .btn:hover { background: var(--primary-light); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-ghost {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }
    .btn-ghost:hover { background: var(--panel2); }
    .card {
      background: var(--panel);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 18px;
      border: 1px solid var(--line);
    }
    .card h3 { margin: 0 0 12px; font-size: 16px; color: var(--primary); }
    .muted { color: var(--muted); font-size: 13px; }

    /* 登录页 */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      background: var(--panel);
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 32px;
      border: 1px solid var(--line);
    }
    .auth-card h2 { margin: 0 0 8px; color: var(--primary); }
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin: 18px 0;
      border-bottom: 1px solid var(--line);
    }
    .auth-tabs span {
      padding: 10px 0;
      cursor: pointer;
      color: var(--muted);
      margin-right: 16px;
      border-bottom: 2px solid transparent;
    }
    .auth-tabs span.active { color: var(--primary); border-color: var(--primary); }
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .form-row input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline-color: var(--primary);
      background: var(--panel2);
    }
    .auth-card .btn { width: 100%; margin-top: 8px; }
    .toast { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }

    /* 主界面 */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      gap: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 38px; height: 38px; background: #fff; color: var(--primary);
      border-radius: 8px; display: grid; place-items: center;
      font-weight: 800; font-size: 14px;
    }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: .5px; }
    .brand .subtitle { font-size: 12px; opacity: .85; }
    .tabs { display: flex; gap: 8px; }
    .tabs .tab {
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      opacity: .85;
      transition: .2s;
    }
    .tabs .tab:hover, .tabs .tab.active { background: rgba(255,255,255,0.15); opacity: 1; }
    .user { display: flex; align-items: center; gap: 12px; font-size: 13px; }

    .main { padding: 20px; max-width: 1500px; margin: 0 auto; }

    /* 智能处理 */
    .run-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      align-items: start;
    }
    .control-card .row { margin-bottom: 14px; }
    .control-card label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .control-card select, .control-card input[type=file] { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
    .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .slider-wrap { display: flex; align-items: center; gap: 12px; }
    .slider-wrap input[type=range] { flex: 1; }
    .actions { display: flex; gap: 10px; margin-top: 16px; }
    .actions .btn { flex: 1; }

    .perception-box { display: flex; flex-direction: column; gap: 12px; }
    .perception-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { background: var(--panel2); border: 1px solid var(--line); border-radius: 16px; padding: 5px 11px; font-size: 12px; }
    .radar-wrap { height: 230px; }

    .pipeline {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 16px;
    }
    .pipeline .step {
      flex: 1;
      min-width: 120px;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      position: relative;
    }
    .pipeline .step.done { border-color: var(--primary); color: var(--primary); background: #eef2ff; }
    .pipeline .step.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .thinking-box {
      background: var(--panel2);
      border-left: 4px solid var(--primary);
      padding: 14px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      max-height: 260px;
      overflow: auto;
    }

    .images-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .img-card img { width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
    .img-card .label { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .metrics { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .metric { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12px; }

    /* 聊天 */
    .chat-wrap {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
    }
    .chat-messages {
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--line);
      height: 520px;
      display: flex;
      flex-direction: column;
    }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .msg { display: flex; gap: 10px; margin-bottom: 16px; }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 12px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .msg.ai .msg-avatar { background: var(--primary); }
    .msg.user .msg-avatar { background: #9ca3af; }
    .bubble {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      max-width: 80%;
      font-size: 14px;
      line-height: 1.6;
    }
    .msg.user .bubble { background: var(--primary); color: #fff; }
    .bubble pre { background: #f3f4f6; padding: 8px; border-radius: 6px; overflow: auto; font-size: 12px; }
    .msg.user .bubble pre { background: rgba(255,255,255,0.15); }
    .chat-input { display: flex; gap: 10px; padding: 12px; border-top: 1px solid var(--line); }
    .chat-input input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; outline-color: var(--primary); }
    .quick-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .chip:hover { border-color: var(--primary); color: var(--primary); }

    /* 论文结果 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .summary-card { text-align: center; }
    .summary-card .num { font-size: 26px; font-weight: 700; color: var(--primary); }
    .summary-card .desc { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th, .data-table td { border: 1px solid var(--line); padding: 8px; text-align: center; }
    .data-table th { background: var(--panel2); color: var(--primary); }
    .data-table tr:nth-child(even) { background: var(--panel2); }
    .figure-card img { width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; }

    /* 算法评测 */
    .innovation-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .inno-card { }
    .inno-card h4 { margin: 0 0 8px; color: var(--primary); }
    .arch-img { width: 100%; border-radius: 10px; border: 1px solid var(--line); margin: 10px 0; }
    .formula { background: var(--panel2); border: 1px dashed var(--line); border-radius: 8px; padding: 10px; font-family: "Courier New", monospace; font-size: 13px; margin: 10px 0; }

    /* API监控 */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
    .stat-card { }
    .stat-card .num { font-size: 24px; font-weight: 700; color: var(--primary); }
    .stat-card .label { font-size: 12px; color: var(--muted); }
    .control-inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .control-inline select, .control-inline input { padding: 8px; border: 1px solid var(--line); border-radius: 6px; min-width: 140px; }

    @media (max-width: 980px) {
      .run-grid, .chat-wrap { grid-template-columns: 1fr; }
      .tabs .tab { padding: 9px 10px; font-size: 13px; }
      .header { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<div id="app">
  <template v-if="!loggedIn">
    <div class="auth-wrap">
      <div class="auth-card">
        <h2>MedDenoise-Agent</h2>
        <div class="muted">VT-BM3D 医学影像智能去噪系统</div>
        <div class="auth-tabs">
          <span :class="{active: authTab==='login'}" @click="authTab='login'">登录</span>
          <span :class="{active: authTab==='register'}" @click="authTab='register'">注册</span>
          <span :class="{active: authTab==='reset'}" @click="authTab='reset'">重置密码</span>
        </div>

        <div v-if="authTab==='login'">
          <div class="form-row"><label>账号</label><input v-model="loginForm.username" placeholder="用户名" @keyup.enter="login"></div>
          <div class="form-row"><label>密码</label><input type="password" v-model="loginForm.password" placeholder="密码" @keyup.enter="login"></div>
          <button class="btn" @click="login" :disabled="loading">登录</button>
          <div class="muted" style="margin-top:10px">演示管理员: admin / 123456</div>
        </div>

        <div v-if="authTab==='register'">
          <div class="form-row"><label>账号</label><input v-model="registerForm.username" placeholder="用户名"></div>
          <div class="form-row"><label>密码</label><input type="password" v-model="registerForm.password" placeholder="密码"></div>
          <div class="form-row"><label>确认密码</label><input type="password" v-model="registerForm.confirm" placeholder="确认密码" @keyup.enter="register"></div>
          <button class="btn" @click="register" :disabled="loading">注册</button>
        </div>

        <div v-if="authTab==='reset'">
          <div class="form-row"><label>账号</label><input v-model="resetForm.username" placeholder="用户名"></div>
          <div class="form-row"><label>新密码</label><input type="password" v-model="resetForm.password" placeholder="新密码"></div>
          <div class="form-row"><label>确认新密码</label><input type="password" v-model="resetForm.confirm" placeholder="确认新密码" @keyup.enter="resetPwd"></div>
          <button class="btn" @click="resetPwd" :disabled="loading">重置</button>
        </div>

        <div class="toast">{{ toast }}</div>
      </div>
    </div>
  </template>

  <template v-else>
    <div class="header">
      <div class="brand">
        <div class="brand-mark">MDA</div>
        <div>
          <h1>MedDenoise-Agent</h1>
          <div class="subtitle">VT-BM3D 医学影像智能去噪与质量增强</div>
        </div>
      </div>
      <div class="tabs">
        <div class="tab" v-for="t in tabs" :key="t.key" :class="{active:tab===t.key}" @click="tab=t.key">{{t.label}}</div>
      </div>
      <div class="user">
        <span>{{user.username}}</span>
        <button class="btn-ghost" @click="logout">退出</button>
      </div>
    </div>

    <div class="main">
      <!-- 智能处理 -->
      <div v-if="tab==='run'" class="run-grid">
        <div class="control-card card">
          <h3>输入配置</h3>
          <div class="row">
            <label>医学影像示例</label>
            <select v-model="sample_id" @change="file=null">
              <option value="">请选择</option>
              <option v-for="s in samples" :key="s.id" :value="s.id">{{s.name}}</option>
            </select>
          </div>
          <div class="row">
            <label>或上传图片</label>
            <input type="file" accept="image/*" @change="onFileChange">
          </div>
          <div class="row">
            <label class="toggle"><input type="checkbox" v-model="add_noise"> 加入高斯噪声模拟</label>
          </div>
          <div class="row" v-if="add_noise">
            <label>噪声强度 σ: {{sigma}}</label>
            <div class="slider-wrap">
              <input type="range" min="5" max="50" step="1" v-model.number="sigma"><span class="muted">{{sigma}}</span>
            </div>
          </div>
          <div class="actions">
            <button class="btn" @click="runAI" :disabled="running">{{ running ? 'AI处理中...' : 'AI智能处理' }}</button>
            <button class="btn-ghost" @click="runStd" :disabled="running">标准处理</button>
          </div>
        </div>

        <div class="perception-box card">
          <h3>感知分析</h3>
          <div class="perception-tags" v-if="perception">
            <span class="tag">模态: {{ perception.modality }}</span>
            <span class="tag">噪声等级: {{ perception.noise_level }}</span>
            <span class="tag">估计 σ: {{ perception.estimated_sigma.toFixed ? perception.estimated_sigma.toFixed(2) : perception.estimated_sigma }}</span>
            <span class="tag">边缘密度: {{ (perception.edge_density||0).toFixed(3) }}</span>
            <span class="tag">纹理复杂度: {{ (perception.texture_complexity||0).toFixed(3) }}</span>
            <span class="tag">动态范围: {{ (perception.dynamic_range||0).toFixed(3) }}</span>
          </div>
          <div class="muted" v-else>选择图像并点击处理后, 这里会显示结构感知分析。</div>
          <div class="radar-wrap" ref="radarChart" v-if="perception"></div>
        </div>

        <div style="grid-column: 1 / -1;">
          <div class="card" style="margin-bottom:16px">
            <div class="pipeline">
              <div v-for="(s, idx) in stageNames" :key="s" class="step"
                   :class="{done: stageState(idx)==='done', active: stageState(idx)==='active'}">{{idx+1}}. {{s}}</div>
            </div>
            <div class="thinking-box" v-if="currentThinking">{{ currentThinking }}</div>
            <div v-else class="muted">点击“AI智能处理”查看 AI 分析、微调与执行全过程。</div>
          </div>

          <div class="card" v-if="result">
            <h3>处理结果</h3>
            <div class="metrics" v-if="result.evaluation">
              <span class="metric" v-for="(v,k) in result.evaluation" :key="k">{{k}}: {{typeof v==='number' ? v.toFixed(3) : v}}</span>
            </div>
            <div class="images-row" style="margin-top:14px">
              <div class="img-card" v-if="result.input_image"><img :src="result.input_image"><div class="label">含噪输入</div></div>
              <div class="img-card" v-if="result.reference_image"><img :src="result.reference_image"><div class="label">原始参考</div></div>
              <div class="img-card" v-if="result.output_image"><img :src="result.output_image"><div class="label">VT-BM3D 去噪结果 (Agent调参)</div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 智能对话 -->
      <div v-if="tab==='chat'" class="chat-wrap">
        <div class="chat-messages">
          <div class="chat-list" ref="chatList">
            <div v-for="(msg, i) in chatMessages" :key="i" class="msg" :class="msg.role">
              <div class="msg-avatar">{{ msg.role==='user' ? 'U' : 'AI' }}</div>
              <div class="bubble" v-html="mdToHtml(msg.content)"></div>
            </div>
            <div v-if="chatSending" class="msg ai"><div class="msg-avatar">AI</div><div class="bubble">思考中...</div></div>
          </div>
          <div class="chat-input">
            <input v-model="chatInput" placeholder="输入问题, 例如: 介绍一下 VT-BM3D 的创新点" @keyup.enter="sendChat">
            <button class="btn" @click="sendChat" :disabled="chatSending">发送</button>
          </div>
        </div>
        <div class="card" style="align-self:start">
          <h3>快捷问题</h3>
          <div class="quick-chips">
            <div class="chip" v-for="q in quickQuestions" :key="q" @click="ask(q)">{{q}}</div>
          </div>
          <h3 style="margin-top:18px">最近处理记录</h3>
          <div class="muted" v-if="!history.length">暂无记录</div>
          <div v-for="h in history.slice(0,3)" :key="h.id" class="muted" style="margin-bottom:8px">
            <strong>#{{h.id}}</strong> {{h.source}} σ={{h.noise_sigma}} PSNR={{h.evaluation&&h.evaluation.psnr?h.evaluation.psnr.toFixed(2):'-'}}
          </div>
        </div>
      </div>

      <!-- 论文结果 -->
      <div v-if="tab==='paper'">
        <div class="summary-grid" v-if="paper && paper.summary">
          <div class="card summary-card"><div class="num">+{{paper.summary.avg_psnr_gain_db}} dB</div><div class="desc">平均 PSNR 提升</div></div>
          <div class="card summary-card"><div class="num">+{{paper.summary.max_psnr_gain_db}} dB</div><div class="desc">最大 PSNR 提升</div></div>
          <div class="card summary-card"><div class="num">{{paper.summary.set12_g3_time_change_pct}}%</div><div class="desc">Set12 g3 耗时变化</div></div>
          <div class="card summary-card"><div class="num">{{paper.summary.bsds300_g3_time_change_pct}}%</div><div class="desc">BSDS300 g3 耗时变化</div></div>
        </div>

        <div class="card" style="margin-bottom:16px">
          <h3>Set12 / BSDS300 PSNR/SSIM 对比 (论文 Table 2)</h3>
          <div ref="paperChart" style="height:360px"></div>
        </div>

        <div class="card" style="margin-bottom:16px">
          <h3>代表性图像结果 (σ=15)</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px">
            <div class="figure-card" v-for="(img, idx) in paperFigures" :key="idx">
              <img :src="img.src">
              <div style="font-size:12px;color:var(--muted);margin-top:6px">{{img.caption}}</div>
            </div>
          </div>
        </div>

        <div class="card" style="margin-bottom:16px">
          <h3>消融实验 (论文 Table 3)</h3>
          <table class="data-table" v-if="paper && paper.table3_ablation">
            <thead><tr><th>方案</th><th>BSDS300 PSNR</th><th>BSDS300 SSIM</th><th>Set12 PSNR</th><th>Set12 SSIM</th></tr></thead>
            <tbody>
              <tr v-for="r in paper.table3_ablation" :key="r.removed"><td>{{r.removed}}</td><td>{{r.bsds300_psnr}}</td><td>{{r.bsds300_ssim}}</td><td>{{r.set12_psnr}}</td><td>{{r.set12_ssim}}</td></tr>
            </tbody>
          </table>
        </div>

        <div class="card">
          <h3>Agent 调参 vs 未调参 (本系统处理记录)</h3>
          <div ref="compareChart" style="height:260px" v-if="compareData.length"></div>
          <div v-else class="muted">暂无处理记录, 请在“智能处理”中运行 AI 处理以生成对比数据。</div>
        </div>
      </div>

      <!-- 算法评测 -->
      <div v-if="tab==='bench'">
        <div class="card" style="margin-bottom:16px">
          <h3>VT-BM3D 主架构</h3>
          <img class="arch-img" src="/static/assets/VT-BM3D-architecture.png" alt="VT-BM3D architecture">
          <p class="muted">VT-BM3D 在经典 BM3D 块匹配协同滤波的基础上, 引入<em>结构感知</em>与<em>噪声自适应</em>两个维度, 通过局部方差与结构张量联合生成结构显著性图, 指导强/弱 BM3D 逐像素融合, 从而在抑制噪声的同时更好地保留边缘与纹理。</p>
          <img class="arch-img" src="/static/assets/BM3D-Pipeline.png" alt="BM3D pipeline" style="max-width:700px">
        </div>

        <div class="innovation-grid">
          <div class="card inno-card">
            <h4>创新点一: 结构感知自适应阈值</h4>
            <div class="formula">C' = α·V_norm + β·λ_norm</div>
            <div class="formula">τ_adaptive = τ_min + (τ_max − τ_min)·(C')^γ</div>
            <p class="muted">局部方差反映内容复杂度, 结构张量最大特征值反映边缘/纹理方向性; 两者线性融合后通过幂律映射为自适应匹配阈值, 平坦区严格匹配、边缘区放宽匹配以保护细节。</p>
            <div ref="thresholdChart" style="height:220px"></div>
          </div>
          <div class="card inno-card">
            <h4>创新点二: 边缘保护与纹理增强</h4>
            <p class="muted">Canny 边缘图中⼼像素参与结构张量增益; 同时当局部方差与最大特征值均高于阈值时判定为纹理区, 对匹配阈值乘以 texture_boost 进一步保留高频细节。</p>
            <ul class="muted" style="padding-left:20px">
              <li>强 BM3D: σ × 1.15 (平坦区域)</li>
              <li>弱 BM3D: σ / texture_boost (边缘/纹理)</li>
              <li>融合: fused = (1−S)·strong + S·weak</li>
            </ul>
          </div>
          <div class="card inno-card">
            <h4>创新点三: 噪声建模与自适应变换选择</h4>
            <p class="muted">针对结构化噪声(高频对角条纹 g3、周期网格 g5)设置差异化参数; 在基础估计阶段使用 DST 更好地稀疏化周期干扰, 最终阶段恢复 DCT 完成紧凑重建。</p>
            <table class="data-table">
              <thead><tr><th>参数</th><th>g3</th><th>g5</th></tr></thead>
              <tbody>
                <tr><td>τ_max</td><td>7000</td><td>7200</td></tr>
                <tr><td>γ</td><td>2.5</td><td>2.6</td></tr>
                <tr><td>texture_boost</td><td>1.4</td><td>1.5</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- API监控 -->
      <div v-if="tab==='api'">
        <div class="card" style="margin-bottom:16px">
          <h3>API 连接状态</h3>
          <div class="control-inline">
            <span :style="{color: apiConfigured ? 'var(--success)' : 'var(--danger)', fontWeight:700}">{{ apiConfigured ? '已配置' : '未配置' }}</span>
            <span class="muted">当前模型: {{ stats && stats.model || '-' }}</span>
            <span class="muted">Base URL: {{ stats && stats.base_url || '-' }}</span>
            <span class="muted">单次 token 上限: {{ stats && stats.max_tokens || '-' }}</span>
            <button class="btn-ghost" @click="checkModel" :disabled="checking">{{ checking ? '检测中...' : '检测连通性' }}</button>
          </div>
          <div v-if="checkResult" class="muted" style="margin-top:8px">{{ checkResult.reachable ? '连通' : '未连通' }} — {{ checkResult.detail }} ({{checkResult.latency_s || 0}}s)</div>
        </div>

        <div class="stats-grid" v-if="stats">
          <div class="card stat-card"><div class="num">{{stats.today.calls}}</div><div class="label">今日调用次数</div></div>
          <div class="card stat-card"><div class="num">{{formatCost(stats.today.cost)}}</div><div class="label">今日费用 ($)</div></div>
          <div class="card stat-card"><div class="num">{{stats.week.calls}}</div><div class="label">近一周调用次数</div></div>
          <div class="card stat-card"><div class="num">{{formatCost(stats.week.cost)}}</div><div class="label">近一周费用 ($)</div></div>
          <div class="card stat-card"><div class="num">{{stats.month.calls}}</div><div class="label">近一月调用次数</div></div>
          <div class="card stat-card"><div class="num">{{formatCost(stats.month.cost)}}</div><div class="label">近一月费用 ($)</div></div>
        </div>

        <div class="card" style="margin-bottom:16px">
          <h3>API 控制</h3>
          <div class="control-inline">
            <label>选择模型</label>
            <select v-model="newConfig.model">
              <option v-for="m in modelList" :key="m.id" :value="m.id">{{m.name}}</option>
            </select>
            <label>单次调用最大 token</label>
            <input type="number" min="200" max="8000" v-model.number="newConfig.max_tokens">
            <button class="btn" @click="saveApiConfig" :disabled="savingConfig">保存</button>
          </div>
        </div>

        <div class="card" style="margin-bottom:16px">
          <h3>近 5 次调用详情</h3>
          <table class="data-table">
            <thead><tr><th>时间</th><th>用途</th><th>模型</th><th>输入 token</th><th>输出 token</th><th>费用 ($)</th><th>耗时</th><th>状态</th></tr></thead>
            <tbody>
              <tr v-for="r in recent5" :key="r.time+r.purpose"><td>{{r.time}}</td><td>{{r.purpose}}</td><td>{{r.model}}</td><td>{{r.input_tokens}}</td><td>{{r.output_tokens}}</td><td>{{r.cost}}</td><td>{{r.latency_s}}s</td><td :style="{color:r.ok?'var(--success)':'var(--danger)'}">{{r.ok?'成功':'失败'}}</td></tr>
            </tbody>
          </table>
          <div v-if="!recent5.length" class="muted">暂无调用记录</div>
        </div>

        <div class="card">
          <h3>每日调用趋势</h3>
          <div ref="apiChart" style="height:300px"></div>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
const { createApp, nextTick } = Vue;

createApp({
  data() {
    return {
      token: localStorage.getItem('mda_token') || '',
      loggedIn: false,
      user: {},
      authTab: 'login',
      loginForm: { username: '', password: '' },
      registerForm: { username: '', password: '', confirm: '' },
      resetForm: { username: '', password: '', confirm: '' },
      toast: '',
      loading: false,
      tab: 'run',
      tabs: [
        { key: 'run', label: '智能处理' },
        { key: 'chat', label: '智能对话' },
        { key: 'paper', label: '论文结果' },
        { key: 'bench', label: '算法评测' },
        { key: 'api', label: 'API监控' },
      ],
      samples: [],
      sample_id: '',
      file: null,
      add_noise: true,
      sigma: 25,
      running: false,
      currentThinking: '',
      perception: null,
      result: null,
      stageNames: ['感知分析','AI分析意见与处理思路','AI调参方案','微调VT-BM3D','执行VT-BM3D','处理结果分析'],
      stageStatus: {},
      history: [],
      chatMessages: [
        { role: 'ai', content: '你好, 我是 MedDenoise-Agent 智能助手。可以为你讲解 VT-BM3D 论文、分析去噪参数, 或帮你调用右侧快捷问题。' }
      ],
      chatInput: '',
      chatSending: false,
      paper: null,
      benchmark: null,
      stats: null,
      modelList: [],
      newConfig: { model: 'gpt-5.4', max_tokens: 1200 },
      savingConfig: false,
      checkResult: null,
      checking: false,
      charts: {},
      quickQuestions: [
        'VT-BM3D 的核心创新是什么',
        '怎样根据边缘密度调参',
        '解释 texture_boost 的作用',
        'Agent 微调和初始方案有什么不同',
      ]
    };
  },
  computed: {
    apiConfigured() { return this.stats && this.stats.configured; },
    paperFigures() {
      if (!this.paper || !this.paper.representative_images) return [];
      const files = ['Baboon.png','Brick-Wall.png','Baboon.png','Brick-Wall.png'];
      return this.paper.representative_images.map((it, i) => ({
        src: '/static/assets/' + files[i],
        caption: `${it.image} (${it.noise}, σ=${it.sigma}) — BM3D PSNR ${it.bm3d_psnr} dB, VT-BM3D PSNR ${it.vtbm3d_psnr} dB`
      }));
    },
    compareData() {
      if (!this.history.length) return [];
      const g = { true: [], false: [] };
      this.history.forEach(h => {
        if (h.evaluation && h.evaluation.psnr != null) {
          g[h.llm ? 'true' : 'false'].push(h.evaluation.psnr);
        }
      });
      const out = [];
      ['true','false'].forEach(k => {
        const arr = g[k];
        if (arr.length) out.push({ name: k==='true'?'Agent 调参':'未调参', avg: arr.reduce((a,b)=>a+b,0)/arr.length, count: arr.length });
      });
      return out;
    },
    recent5() { return this.stats && this.stats.recent ? this.stats.recent.slice(0,5) : []; }
  },
  async mounted() {
    if (this.token) {
      const r = await this.authFetch('/api/auth/me');
      if (r && r.ok) {
        this.loggedIn = true;
        this.user = { username: r.username };
        this.loadSamples();
        this.loadHistory();
        this.loadPaper();
        this.loadBenchmark();
        this.loadStats();
        this.loadModels();
      } else {
        this.token = '';
        localStorage.removeItem('mda_token');
      }
    }
    window.addEventListener('resize', this.resizeCharts);
  },
  methods: {
    // auth
    async login() {
      this.loading = true; this.toast = '';
      const form = new URLSearchParams(this.loginForm);
      const r = await fetch('/api/auth/login', { method: 'POST', body: form }).then(x=>x.json());
      this.loading = false;
      if (r.ok) {
        this.token = r.token;
        localStorage.setItem('mda_token', r.token);
        this.loggedIn = true;
        this.user = { username: r.username };
        this.loadSamples(); this.loadHistory(); this.loadPaper(); this.loadBenchmark(); this.loadStats(); this.loadModels();
      } else { this.toast = r.detail || '登录失败'; }
    },
    async register() {
      this.loading = true; this.toast = '';
      const form = new URLSearchParams(this.registerForm);
      const r = await fetch('/api/auth/register', { method: 'POST', body: form }).then(x=>x.json());
      this.loading = false;
      if (r.ok) { this.toast = '注册成功, 请登录'; this.authTab = 'login'; }
      else { this.toast = r.detail || '注册失败'; }
    },
    async resetPwd() {
      this.loading = true; this.toast = '';
      const form = new URLSearchParams(this.resetForm);
      const r = await fetch('/api/auth/reset', { method: 'POST', body: form }).then(x=>x.json());
      this.loading = false;
      if (r.ok) { this.toast = '密码已重置, 请登录'; this.authTab = 'login'; }
      else { this.toast = r.detail || '重置失败'; }
    },
    async logout() {
      await this.authFetch('/api/auth/logout', { method: 'POST' });
      this.token = ''; localStorage.removeItem('mda_token'); this.loggedIn = false; this.user = {};
    },
    authFetch(url, opts={}) {
      opts.headers = opts.headers || {};
      opts.headers['Authorization'] = 'Bearer ' + this.token;
      return fetch(url, opts).then(r => {
        if (r.status === 401) { this.logout(); }
        return r.json().catch(() => ({}));
      });
    },

    // common
    onFileChange(e) { this.file = e.target.files[0]; this.sample_id = ''; },
    mdToHtml(t) {
      if (!t) return '';
      let s = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      s = s.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
      s = s.replace(/\n/g, '<br>');
      return s;
    },
    async loadSamples() {
      const r = await this.authFetch('/api/samples');
      this.samples = Array.isArray(r) ? r : [];
    },
    async loadHistory() {
      const r = await this.authFetch('/api/history');
      this.history = Array.isArray(r) ? r : [];
    },
    stageState(idx) {
      const name = this.stageNames[idx];
      if (this.stageStatus[name] === 'active') return 'active';
      if (this.stageStatus[name] === 'done') return 'done';
      if (this.currentStage === name) return 'active';
      return '';
    },

    // run
    async runAI() {
      this.running = true; this.result = null; this.perception = null; this.currentThinking = '';
      this.stageStatus = {};
      const form = new FormData();
      if (this.file) form.append('file', this.file);
      else if (this.sample_id) form.append('sample_id', this.sample_id);
      else { alert('请选择示例或上传图片'); this.running = false; return; }
      form.append('add_noise', this.add_noise);
      form.append('sigma', this.sigma);
      const res = await fetch('/api/ai_process', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + this.token }, body: form
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n\n');
        buf = lines.pop() || '';
        for (const line of lines) {
          const m = line.trim().match(/^data:(.+)/s);
          if (!m) continue;
          try {
            const ev = JSON.parse(m[1].trim());
            if (ev.type === 'stage') { this.currentStage = ev.stage; this.stageStatus[ev.stage] = 'active'; }
            if (ev.type === 'thinking') { this.currentThinking = ev.text; this.stageStatus[ev.stage] = 'active'; }
            if (ev.type === 'decision') { this.currentThinking = ''; }
            if (ev.type === 'perception') { this.perception = ev.perception; nextTick(() => this.renderRadar()); }
            if (ev.type === 'result') { this.result = ev; this.currentThinking = ''; this.stageStatus[ev.stage || '处理结果分析'] = 'done'; this.loadHistory(); }
            // mark previous stages done
            let seen = false;
            for (const s of this.stageNames) {
              if (!seen) { if (this.stageStatus[s] === 'active') seen = true; else this.stageStatus[s] = 'done'; }
            }
          } catch (e) {}
        }
      }
      this.running = false;
    },
    async runStd() {
      this.running = true; this.result = null; this.perception = null;
      const form = new FormData();
      if (this.file) form.append('file', this.file);
      else if (this.sample_id) form.append('sample_id', this.sample_id);
      else { this.running = false; return; }
      form.append('add_noise', this.add_noise);
      form.append('sigma', this.sigma);
      const r = await this.authFetch('/api/process', { method: 'POST', body: form });
      this.running = false;
      this.result = { input_image: r.input_image, output_image: r.output_image, reference_image: r.reference_image, evaluation: r.evaluation };
      this.perception = r.perception;
      nextTick(() => this.renderRadar());
    },

    // vis
    renderRadar() {
      if (!this.perception) return;
      const el = this.$refs.radarChart; if (!el) return;
      const p = this.perception;
      const indicators = [
        { name: '噪声 σ', max: Math.max(10, Number(p.estimated_sigma) * 1.5 || 1) },
        { name: '边缘密度', max: 0.5 },
        { name: '纹理复杂度', max: 0.7 },
        { name: '结构相干性', max: 1 },
        { name: '动态范围', max: 1 },
        { name: '颗粒度', max: 1 },
      ];
      const data = [Number(p.estimated_sigma) || 0, Number(p.edge_density) || 0, Number(p.texture_complexity) || 0, Number(p.mean_coherence) || 0, Number(p.dynamic_range) || 0, Number(p.graininess) || 0];
      if (this.charts.radar) this.charts.radar.dispose();
      this.charts.radar = echarts.init(el);
      this.charts.radar.setOption({
        radar: { indicator: indicators, radius: '65%' },
        series: [{ type: 'radar', data: [{ value: data, name: '影像感知', areaStyle: { color: 'rgba(18,46,138,0.2)' }, lineStyle: { color: '#122e8a' }, itemStyle: { color: '#122e8a' } }] }]
      });
    },

    // chat
    ask(q) { this.chatInput = q; this.sendChat(); },
    async sendChat() {
      const msg = this.chatInput.trim(); if (!msg) return;
      this.chatMessages.push({ role: 'user', content: msg }); this.chatInput = '';
      this.chatSending = true; nextTick(() => this.$refs.chatList.scrollTop = this.$refs.chatList.scrollHeight);
      const form = new FormData(); form.append('message', msg);
      const history = this.chatMessages.slice(-10).map(m => ({ role: m.role, content: m.content }));
      form.append('history', JSON.stringify(history));
      const r = await this.authFetch('/api/chat', { method: 'POST', body: form });
      this.chatSending = false;
      this.chatMessages.push({ role: 'ai', content: r.reply || '抱歉, 暂时没有回复。' });
      if (r.images) {
        r.images.forEach(img => this.chatMessages.push({ role: 'ai', content: `<div class='label'>${img.label}</div><img src='${img.src}' style='max-width:100%;border-radius:6px;'>` }));
      }
      nextTick(() => this.$refs.chatList.scrollTop = this.$refs.chatList.scrollHeight);
    },

    // paper
    async loadPaper() {
      this.paper = await this.authFetch('/api/paper_results');
      nextTick(() => this.renderPaperChart());
    },
    async loadBenchmark() { this.benchmark = await this.authFetch('/api/benchmark'); },
    renderPaperChart() {
      if (!this.paper || !this.paper.table2) return;
      const el = this.$refs.paperChart; if (!el) return;
      if (this.charts.paper) this.charts.paper.dispose();
      this.charts.paper = echarts.init(el);
      const series = [];
      ['Set12','BSDS300'].forEach(ds => {
        ['g3','g5'].forEach(noise => {
          const rows = this.paper.table2.filter(r => r.dataset===ds && r.noise===noise).sort((a,b)=>a.sigma-b.sigma);
          series.push({ name: `${ds} ${noise} BM3D`, type: 'bar', data: rows.map(r=>r.bm3d_psnr.toFixed(2)), itemStyle:{opacity:.5} });
          series.push({ name: `${ds} ${noise} VT-BM3D`, type: 'bar', data: rows.map(r=>r.vtbm3d_psnr.toFixed(2)) });
        });
      });
      const xs = [5,15,25,35];
      this.charts.paper.setOption({
        tooltip: { trigger: 'axis' },
        legend: { type: 'scroll', bottom: 0 },
        grid: { left: '3%', right: '3%', bottom: '15%', containLabel: true },
        xAxis: { type: 'category', data: xs.map(s=>`σ=${s}`) },
        yAxis: { type: 'value', name: 'PSNR (dB)' },
        series: series
      });
      nextTick(() => this.renderCompareChart());
    },
    renderCompareChart() {
      const el = this.$refs.compareChart; if (!el || !this.compareData.length) return;
      if (this.charts.compare) this.charts.compare.dispose();
      this.charts.compare = echarts.init(el);
      this.charts.compare.setOption({
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: this.compareData.map(d=>d.name) },
        yAxis: { type: 'value', name: '平均 PSNR (dB)' },
        series: [{ type: 'bar', data: this.compareData.map(d=>d.avg.toFixed(2)), itemStyle:{color:'#122e8a'} }]
      });
    },

    // bench
    async renderBenchCharts() {
      await nextTick();
      const el = this.$refs.thresholdChart; if (!el) return;
      if (this.charts.threshold) this.charts.threshold.dispose();
      this.charts.threshold = echarts.init(el);
      const x = [];
      for (let c=0;c<=100;c++) x.push((c/100).toFixed(2));
      this.charts.threshold.setOption({
        tooltip: {},
        grid: { left:'12%', right:'8%', top:'10%', bottom:'15%' },
        xAxis: { type: 'category', data: x, name: 'C\'' },
        yAxis: { type: 'value', name: 'τ' },
        series: [{ data: x.map(v => 1200 + (7000-1200)*Math.pow(parseFloat(v),2.5)), type: 'line', smooth:true, lineStyle:{color:'#122e8a'} }]
      });
    },

    // api
    async loadStats() {
      this.stats = await this.authFetch('/api/api_stats');
      if (this.stats) {
        this.newConfig.model = this.stats.model || 'gpt-5.4';
        this.newConfig.max_tokens = this.stats.max_tokens || 1200;
      }
      nextTick(() => this.renderApiChart());
    },
    async loadModels() {
      this.modelList = await this.authFetch('/api/models') || [];
    },
    formatCost(v) { return Number(v || 0).toFixed(6); },
    async saveApiConfig() {
      this.savingConfig = true;
      const form = new FormData();
      form.append('model', this.newConfig.model);
      form.append('max_tokens', this.newConfig.max_tokens);
      const r = await this.authFetch('/api/api_config', { method: 'POST', body: form });
      this.savingConfig = false;
      if (r && r.ok) { this.loadStats(); }
    },
    async checkModel() {
      this.checking = true;
      this.checkResult = await this.authFetch('/api/check_model', { method: 'POST' });
      this.checking = false;
    },
    renderApiChart() {
      if (!this.stats || !this.stats.daily) return;
      const el = this.$refs.apiChart; if (!el) return;
      if (this.charts.api) this.charts.api.dispose();
      this.charts.api = echarts.init(el);
      const keys = Object.keys(this.stats.daily).sort();
      this.charts.api.setOption({
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: keys },
        yAxis: [{ type: 'value', name: '调用次数' }, { type: 'value', name: '费用 ($)' }],
        series: [
          { name: '调用次数', type: 'bar', data: keys.map(k=>this.stats.daily[k].calls) },
          { name: '费用', type: 'line', yAxisIndex:1, data: keys.map(k=>this.stats.daily[k].cost), itemStyle:{color:'#122e8a'} }
        ]
      });
    },
    resizeCharts() {
      Object.values(this.charts).forEach(c => c && c.resize());
    }
  },
  watch: {
    tab(v) {
      if (v === 'paper') { this.loadPaper(); }
      if (v === 'api') { this.loadStats(); this.loadModels(); }
      if (v === 'bench') { this.renderBenchCharts(); }
      if (v === 'run') { this.loadSamples(); }
      nextTick(() => this.resizeCharts());
    }
  }
}).mount('#app');
</script>
</body>
</html>
